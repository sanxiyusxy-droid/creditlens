[project]
name = "creditlens"
version = "1.1.0"
description = "CreditLens: 小微企业授信尽调与审查 Multi-Agent 系统（证据优先的深度 RAG）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "qdrant-client>=1.12",
    "minio>=7.2",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "jieba>=0.42",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "psycopg2-binary>=2.9",  # Alembic 同步迁移驱动
    "streamlit>=1.60.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditlens"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # 中文全角标点不是错误

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "integration: 需要真实 PostgreSQL/Qdrant/MinIO 服务（Docker Compose）",
]
