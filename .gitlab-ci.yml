# CreditLens GitLab CI
# 三阶段：lint -> unit -> integration（真实 PG + Qdrant + RLS 业务角色 + Seed）
#
# Integration 说明（v1.1）：
# - Qdrant 镜像固定版本（与 uv.lock 的 qdrant-client 1.18.0 对应）；
# - 测试库 creditlens_test 由 postgres service 通过 POSTGRES_DB 创建；
# - 以超级用户执行 Alembic 迁移与 RLS 基线（管理账号与业务账号分离）；
# - 业务角色 creditlens_app 为 NOSUPERUSER NOBYPASSRLS（RLS 测试前提）；
# - Seed 与测试均以业务角色连接，RLS 上下文由 session_scope 注入；
# - 阶段末尾断言 0 skip（DATABASE_URL/QDRANT_URL 已在 variables 中提供）。

stages:
  - lint
  - test
  - integration

variables:
  UV_VERSION: "0.7.x"
  PYTHON_VERSION: "3.12"

# ---------- Lint ----------
lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install uv
  script:
    - uv sync --frozen
    - uv run ruff check src/ tests/ apps/ scripts/
    - uv run ruff format --check src/ tests/ apps/ scripts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- Unit / Security / 非集成 E2E ----------
unit:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install uv
  script:
    - uv sync --frozen
    # -m "not integration"：覆盖 tests/ 下所有不需要真实栈的用例（含 e2e 中的 sqlite 用例），
    # 避免按目录枚举造成的覆盖缺口
    - uv run pytest -m "not integration" -q --timeout=180
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- Integration Tests（真实 PG + Qdrant + RLS） ----------
integration:
  stage: integration
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: postgres:16
      alias: pg
    - name: qdrant/qdrant:v1.18.0
      alias: qdrant
  variables:
    POSTGRES_DB: "creditlens_test"
    POSTGRES_PASSWORD: "postgres"
    PGPASSWORD: "postgres"
    # 业务角色（NOSUPERUSER NOBYPASSRLS）：Seed 与测试均以此连接
    DATABASE_URL: "postgresql+asyncpg://creditlens_app:creditlens_app@pg:5432/creditlens_test"
    QDRANT_URL: "http://qdrant:6333"
    # 与 GitHub CI 一致：集成门禁不依赖外部模型服务或开发机 .env。
    EMBEDDING_PROVIDER: "hash_fallback"
    EMBEDDING_VERSION: "hash-embed-v1"
    EMBEDDING_DIM: "256"
    RERANK_PROVIDER: "disabled"
    LLM_PROVIDER: "disabled"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client > /dev/null
    - pip install uv
    - uv sync --frozen
    # 1) 管理身份（超级用户）：创建 NOSUPERUSER NOBYPASSRLS 业务角色
    - psql -h pg -U postgres -d creditlens_test -f infra/postgres/ci_role.sql
    # 2) 管理身份：Alembic 迁移（env.py 自动剥离 +asyncpg 走同步驱动）
    - DATABASE_URL="postgresql://postgres:postgres@pg:5432/creditlens_test" uv run alembic upgrade head
    # 3) 管理身份：应用 RLS 基线（ENABLE + FORCE + 租户/案件级策略）
    - psql -h pg -U postgres -d creditlens_test -f infra/postgres/rls_policies.sql
    # 4) 管理身份：授权根只能由管理身份创建；业务 Seed 不得自授 Membership
    - psql -h pg -U postgres -d creditlens_test -f infra/postgres/ci_seed_principals.sql
    # 5) 管理身份：向业务角色授权（case_memberships 仅保留业务读取）
    - psql -h pg -U postgres -d creditlens_test -c "GRANT USAGE ON SCHEMA public TO creditlens_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO creditlens_app; GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO creditlens_app; REVOKE UPDATE, DELETE ON run_events, human_decisions, report_versions, evidence, artifacts FROM creditlens_app; REVOKE UPDATE, DELETE ON claims FROM creditlens_app; GRANT UPDATE (review_status) ON claims TO creditlens_app; REVOKE INSERT, UPDATE, DELETE ON tenants, app_users, financial_metric_definitions, search_index_versions, alembic_version FROM creditlens_app; REVOKE INSERT, UPDATE, DELETE ON case_memberships FROM creditlens_app; REVOKE INSERT, DELETE ON credit_cases FROM creditlens_app;"
    # 6) 业务身份：三案件幂等 Seed（幂等；RLS 上下文由 session_scope 注入）
    - uv run python scripts/seed_synthetic_data.py
  script:
    # POSIX sh 可移植地保留 pytest 失败码（python:slim 不假设 bash/pipefail）。
    - |
      pytest_exit=0
      uv run pytest tests/e2e/ -m integration -ra -q --timeout=300 > integration_result.txt 2>&1 || pytest_exit=$?
      cat integration_result.txt
      test "$pytest_exit" -eq 0
    # Integration 必须 0 skip / 0 fail：出现 skipped 即失败
    - "! grep -q 'skipped' integration_result.txt"
    # 必须确有用例通过（防止 collection 为空被当成成功）
    - grep -Eq '[0-9]+ passed' integration_result.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: false
