name: creditlens

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: creditlens
      POSTGRES_PASSWORD: creditlens
      POSTGRES_DB: creditlens
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditlens -d creditlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # 固定版本：与 uv.lock 的 qdrant-client 1.18.0 对应（v1.1）
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: creditlens
      MINIO_ROOT_PASSWORD: creditlens-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 creditlens creditlens-dev-secret &&
      mc mb --ignore-existing local/creditlens-raw &&
      mc mb --ignore-existing local/creditlens-parsed &&
      mc mb --ignore-existing local/creditlens-rendered &&
      mc mb --ignore-existing local/creditlens-reports &&
      mc version enable local/creditlens-raw &&
      mc version enable local/creditlens-reports
      "

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  qdrant_data:
  minio_data:
  redis_data:
