name: creditlens

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: creditlens
      POSTGRES_PASSWORD: creditlens
      POSTGRES_DB: creditlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # v1.6 freezes every demo aggregate identifier. Keep the legacy random-ID
      # database untouched and bootstrap the reproducible demo in its own volume.
      - pg_data_v16_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditlens -d creditlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # 固定版本：与 uv.lock 的 qdrant-client 1.18.0 对应（v1.1）
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # v1.6 uses a version-pinned fresh index volume. The legacy qdrant_data
      # volume is intentionally left untouched for snapshot migration/rollback.
      - qdrant_data_v18:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: creditlens
      MINIO_ROOT_PASSWORD: creditlens-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      # Object keys are derived from the same frozen identities as PostgreSQL.
      # A versioned volume avoids mixing legacy objects into exact-set preflight.
      - minio_data_v16_demo:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 creditlens creditlens-dev-secret &&
      mc mb --ignore-existing local/creditlens-raw &&
      mc mb --ignore-existing local/creditlens-parsed &&
      mc mb --ignore-existing local/creditlens-rendered &&
      mc mb --ignore-existing local/creditlens-reports &&
      mc version enable local/creditlens-raw &&
      mc version enable local/creditlens-reports
      "

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data_v16_demo:
  qdrant_data_v18:
  minio_data_v16_demo:
  redis_data:
