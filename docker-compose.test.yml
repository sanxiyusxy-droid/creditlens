# 本地集成测试环境：PG + Qdrant（无 MinIO/Redis，测试用 local_fs）
# 一条命令完成建库/迁移/RLS/授权/Seed/测试（与 CI 同序列）：
#     powershell -ExecutionPolicy Bypass -File scripts/run_integration.ps1
# 该脚本全程使用业务角色 creditlens_app（NOSUPERUSER NOBYPASSRLS），
# 不以超级用户绕过 RLS——否则 RLS 隔离测试等于没测。

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditlens_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  qdrant:
    # 固定版本：与 uv.lock 的 qdrant-client 1.18.0 对应（v1.1，与 CI 一致）
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6334:6333"
    healthcheck:
      # qdrant 镜像不含 curl/wget：用 bash 的 /dev/tcp 探测端口，
      # 否则服务实际可用却一直显示 unhealthy
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
