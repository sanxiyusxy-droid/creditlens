# 本地集成测试环境：PG + Qdrant（无 MinIO/Redis，测试用 local_fs）
# 用法：docker compose -f docker-compose.test.yml up -d
#       docker compose -f docker-compose.test.yml exec -T postgres psql -U postgres -d creditlens_test -f - < infra/postgres/ci_role.sql
#       DATABASE_URL=postgresql://postgres:postgres@localhost:5433/creditlens_test uv run alembic upgrade head
#       docker compose -f docker-compose.test.yml exec -T postgres psql -U postgres -d creditlens_test -f - < infra/postgres/rls_policies.sql
#       （授权 + Seed + 测试见 .gitlab-ci.yml integration 阶段，本地等价执行）

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditlens_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  qdrant:
    # 固定版本：与 uv.lock 的 qdrant-client 1.18.0 对应（v1.1，与 CI 一致）
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6334:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
